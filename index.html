<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ironman Reactor</title>


    <link rel="stylesheet" href="style.css">
</head>
<body>
 <div class="Ironman">
    <div class="Ironman-core center-position"></div>
       
    <div class="core-2">
        <div class="square center-position"
        style="--square: 160px; --rotation-period: 5.86s; --square-border: 6px"></div>
    </div>

    <div class="core-3">
        <div class="square1 center-position"style="--square: 230px; --rotation-period: 5.86s; --square-border: 10px"></div>
        <div class="ring1 center-position" style="--ring: 240px; --orbit-period: 8.8s; --ring-border: 2px;"></div>

    </div>
       
    <div class="core-4">
        <div class="square center-position"
        style="--square: 300px; --rotation-period: 5.86s; --square-border: 20px"></div>
        <div class="ring center-position" style="--ring: 340px; --orbit-period: 8.8s; --ring-border: 2px;"></div>
    </div>

  </div>

</div>
</body>
</html>
